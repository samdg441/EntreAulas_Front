sonar.projectKey=EntreAulas_Front
sonar.projectName=EntreAulas_Front
sonar.host.url=http://sonarqube:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/test

# Requisitos con pruebas en src/test (unitarias e integración):
# RQ1   Registro de usuarios desde admin  → AdminUsersPage.tsx, gestionar-usuarios.ts, validation.ts
# RQ2   Login                             → login-flow.ts, Login.tsx, AuthContext.tsx
# RQ3.1 Solicitud de recuperación         → password-reset-flow.ts, ForgotPassword.tsx
# RQ3.2 Validación del token              → password-reset-flow.ts, passwordReset.ts, ResetPassword.tsx
# RQ4   Envío del correo de recuperación  → passwordReset.ts, ForgotPassword.tsx
# RQ5   Restablecer contraseña            → password-reset-flow.ts, passwordReset.ts, ResetPassword.tsx
# RQ18  Validar y generar QR              → qr-validacion.ts
# RQ19  Redirigir al dashboard por rol    → dashboard-path.ts
# RQ22  Métricas de evaluación            → calificaciones.ts
# RQ23  Estadísticas históricas           → calificaciones.ts
# RQ24  Resumen del coordinador           → docentes.ts
# RQ25  Exportar reporte                  → reporte-exportacion.ts
sonar.inclusions=\
src/features/dashboard-admin/AdminUsersPage.tsx,\
src/features/dashboard-admin/gestionar-usuarios.ts,\
src/lib/validation.ts,\
src/features/auth/login-flow.ts,\
src/features/auth/Login.tsx,\
src/context/AuthContext.tsx,\
src/features/auth/password-reset-flow.ts,\
src/api/passwordReset.ts,\
src/features/auth/ForgotPassword.tsx,\
src/features/auth/ResetPassword.tsx,\
src/features/evaluations/qr-validacion.ts,\
src/features/auth/dashboard-path.ts,\
src/lib/calificaciones.ts,\
src/features/dashboard-coordinator/docentes.ts,\
src/utils/reporte-exportacion.ts

sonar.test.inclusions=src/test/unit/**/*.test.ts,src/test/integration/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**

# Vitest genera este archivo con npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=src/test/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts
