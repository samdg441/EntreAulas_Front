sonar.projectKey=EntreAulas-Front_Refactor
sonar.projectName=EntreAulas-Front_Refactor
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts,src/test/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**

# Vitest genera este archivo con npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage de RQ6 y RQ14–RQ17: solo dominio que sí pegan las unitarias.
# RQ6  → src/features/auth/dashboard-path.ts
# RQ17 → src/features/evaluations/qr-entrada.ts
# RQ14–RQ16 unitarias usan src/test/helpers/qr.ts (carpeta de tests, no cuenta).
sonar.coverage.inclusions=src/features/auth/dashboard-path.ts,src/features/evaluations/qr-entrada.ts

# Fuera de coverage (Sonar igual reporta issues en estos archivos):
# RQ14 → QrEvaluationEntry.tsx (auto-enroll)
# RQ15 → AdminQrPage.tsx, ScheduleSurveys.tsx, evaluations.api.ts (batch)
# RQ16 → AdminQrPage.tsx, ScheduleSurveys.tsx (share-email)
# RQ17 → QrEvaluationEntry.tsx (entrada; la lógica medible está en qr-entrada.ts)
sonar.coverage.exclusions=src/test/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts,src/main.tsx,src/App.tsx,src/features/dashboard-admin/AdminQrPage.tsx,src/features/evaluations/ScheduleSurveys.tsx,src/features/evaluations/QrEvaluationEntry.tsx,src/api/evaluations.api.ts,src/components/CourseQrPoster.tsx,src/features/dashboard-student/**,src/features/dashboard-teacher/**,src/features/dashboard-dean/**,src/features/dashboard-coordinator/**,src/features/auth/Login.tsx,src/features/evaluations/EvaluationForm.tsx,src/features/evaluations/TeacherSelection.tsx,src/features/evaluations/ReportsPage.tsx,src/features/evaluations/SurveyView.tsx,src/features/evaluations/SurveyResults.tsx,src/features/evaluations/EvaluationGoodbye.tsx,src/api/teachers.ts,src/api/users.ts,src/api/surveys.api.ts,src/api/coordinador.api.ts,src/api/client.ts,src/api/passwordReset.ts,src/api/auth.ts,src/api/ai.ts,src/components/**,src/context/**,src/lib/**,src/routes/**,src/types/**
