# Entorno reproducible del pipeline: Jenkins + SonarQube + front y back en contenedores.
#   docker compose -f ci/docker-compose.ci.yml up -d
# Jenkins: http://localhost:8080 · SonarQube: http://localhost:9000 (admin/admin; cámbiala y crea un token)
services:
  sonarqube:
    image: sonarqube:community
    ports: ["9000:9000"]
    environment: { SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true" }
    volumes: [sonar_data:/opt/sonarqube/data]
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports: ["8080:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [sonarqube]
volumes: { sonar_data: {}, jenkins_home: {} }
