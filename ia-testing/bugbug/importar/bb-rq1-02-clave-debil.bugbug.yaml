# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq1-02-clave-debil
  name: BB-RQ1-02 Clave sin carácter especial (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Login como admin
    slug: bb-rq1-02-clave-debil-1
    steps:
    - action: goto
      name: Abrir /login
      action_details:
        url: '{{url}}/login'
    - action: click
      name: Abrir el selector de tipo de usuario
      action_details:
        selector: xpath=(//form//button[@type="button"])[1]
    - action: click
      name: Elegir «Administrador»
      action_details:
        selector: xpath=//form//button[@type="button" and normalize-space(.)="Administrador"]
    - action: type
      name: Escribir el correo
      action_details:
        selector: xpath=//input[@type="email"]
        value: '{{admin_email}}'
    - action: type
      name: Escribir la contraseña
      action_details:
        selector: xpath=//input[@type="password"]
        value: '{{admin_password}}'
        has_secret_value: true
    - action: click
      name: Iniciar sesión
      action_details:
        selector: xpath=//button[@type="submit"]
    - action: assert
      name: La URL contiene /dashboard-admin
      action_details:
        assertion_property: pageUrlIs
        assertion_type: contain
        assertion_expected_value: /dashboard-admin
  - group_name: Alta
    slug: bb-rq1-02-clave-debil-2
    steps:
    - action: goto
      name: Abrir /admin/users
      action_details:
        url: '{{url}}/admin/users'
    - action: click
      name: Abrir «Agregar usuario»
      action_details:
        selector: xpath=//button[normalize-space(.)="Agregar usuario"]
    - action: assert
      name: El formulario de alta está abierto
      action_details:
        selector: xpath=//h2[normalize-space(.)="Agregar usuario"]
        assertion_property: visible
        assertion_type: any
    - action: type
      name: Nombre
      action_details:
        selector: xpath=//*[@id="nombre"]
        value: BUGBUG
    - action: type
      name: Apellido
      action_details:
        selector: xpath=//*[@id="apellido"]
        value: DEBIL
    - action: type
      name: Usuario del correo
      action_details:
        selector: xpath=//*[@id="correo-institucional"]
        value: bb.debil
    - action: type
      name: Contraseña
      action_details:
        selector: xpath=//*[@id="contraseña"]
        value: ClaveSegura2026
        has_secret_value: true
    - action: click
      name: Crear
      action_details:
        selector: xpath=//form//button[@type="submit" and normalize-space(.)="Crear"]
    - action: assert
      name: La página muestra «al menos un carácter especial»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: al menos un carácter especial
    - action: assert
      name: El modal sigue abierto
      action_details:
        selector: xpath=//h2[normalize-space(.)="Agregar usuario"]
        assertion_property: visible
        assertion_type: any
