# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq2-04-correo-sin-arroba
  name: BB-RQ2-04 Correo sin arroba (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Login
    slug: bb-rq2-04-correo-sin-arroba-1
    steps:
    - action: goto
      name: Abrir /login
      action_details:
        url: '{{url}}/login'
    - action: type
      name: Escribir correo inválido
      action_details:
        selector: xpath=//input[@type="email"]
        value: correo-sin-arroba
    - action: assert
      name: La página muestra «Por favor, ingresa un correo electrónico válido»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: Por favor, ingresa un correo electrónico válido
