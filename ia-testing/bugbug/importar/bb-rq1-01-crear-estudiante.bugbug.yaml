# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq1-01-crear-estudiante
  name: BB-RQ1-01 Crear estudiante (exitoso)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Login como admin
    slug: bb-rq1-01-crear-estudiante-1
    steps:
    - action: goto
      name: Abrir /login
      action_details:
        url: '{{url}}/login'
    - action: click
      name: Abrir el selector de tipo de usuario
      action_details:
        selector: xpath=(//form//button[@type="button"])[1]
    - action: click
      name: Elegir «Administrador»
      action_details:
        selector: xpath=//form//button[@type="button" and normalize-space(.)="Administrador"]
    - action: type
      name: Escribir el correo
      action_details:
        selector: xpath=//input[@type="email"]
        value: '{{admin_email}}'
    - action: type
      name: Escribir la contraseña
      action_details:
        selector: xpath=//input[@type="password"]
        value: '{{admin_password}}'
        has_secret_value: true
    - action: click
      name: Iniciar sesión
      action_details:
        selector: xpath=//button[@type="submit"]
    - action: assert
      name: La URL contiene /dashboard-admin
      action_details:
        assertion_property: pageUrlIs
        assertion_type: contain
        assertion_expected_value: /dashboard-admin
  - group_name: Alta
    slug: bb-rq1-01-crear-estudiante-2
    steps:
    - action: setLocalVariable
      name: Variable usuario
      action_details:
        local_variable_name: usuario
        local_variable_source: evaluate
        code: return 'bb.' + Date.now()
    - action: goto
      name: Abrir /admin/users
      action_details:
        url: '{{url}}/admin/users'
    - action: click
      name: Abrir «Agregar usuario»
      action_details:
        selector: xpath=//button[normalize-space(.)="Agregar usuario"]
    - action: assert
      name: El formulario de alta está abierto
      action_details:
        selector: xpath=//h2[normalize-space(.)="Agregar usuario"]
        assertion_property: visible
        assertion_type: any
    - action: type
      name: Nombre
      action_details:
        selector: xpath=//*[@id="nombre"]
        value: BUGBUG
    - action: type
      name: Apellido
      action_details:
        selector: xpath=//*[@id="apellido"]
        value: PRUEBA
    - action: type
      name: Usuario del correo
      action_details:
        selector: xpath=//*[@id="correo-institucional"]
        value: '{{usuario}}'
    - action: type
      name: Contraseña
      action_details:
        selector: xpath=//*[@id="contraseña"]
        value: '{{clave_valida}}'
        has_secret_value: true
    - action: click
      name: Crear
      action_details:
        selector: xpath=//form//button[@type="submit" and normalize-space(.)="Crear"]
    - action: assert
      name: El modal se cerró
      action_details:
        selector: xpath=//h2[normalize-space(.)="Agregar usuario"]
        assertion_property: notVisible
        assertion_type: any
    - action: type
      name: Buscar al usuario creado
      action_details:
        selector: xpath=//input[@placeholder="Buscar por nombre, email o rol…"]
        value: '{{usuario}}'
    - action: assert
      name: La página muestra «@soyudemedellin.edu.co»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: '@soyudemedellin.edu.co'
