# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq32-02-enlace-incompleto
  name: BB-RQ32-02 Enlace incompleto (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Validación
    slug: bb-rq32-02-enlace-incompleto-1
    steps:
    - action: goto
      name: Abrir /reset-password
      action_details:
        url: '{{url}}/reset-password'
    - action: assert
      name: La página muestra «inválido o está incompleto»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: inválido o está incompleto
