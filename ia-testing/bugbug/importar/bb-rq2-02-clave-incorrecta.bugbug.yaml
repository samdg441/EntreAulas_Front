# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq2-02-clave-incorrecta
  name: BB-RQ2-02 Clave incorrecta (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Login
    slug: bb-rq2-02-clave-incorrecta-1
    steps:
    - action: goto
      name: Abrir /login
      action_details:
        url: '{{url}}/login'
    - action: type
      name: Escribir el correo
      action_details:
        selector: xpath=//input[@type="email"]
        value: '{{estudiante_email}}'
    - action: type
      name: Escribir la contraseña
      action_details:
        selector: xpath=//input[@type="password"]
        value: Incorrecta#2026
        has_secret_value: true
    - action: click
      name: Iniciar sesión
      action_details:
        selector: xpath=//button[@type="submit"]
    - action: assert
      name: La página muestra «Credenciales inválidas»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: Credenciales inválidas
    - action: assert
      name: La URL contiene /login
      action_details:
        assertion_property: pageUrlIs
        assertion_type: contain
        assertion_expected_value: /login
