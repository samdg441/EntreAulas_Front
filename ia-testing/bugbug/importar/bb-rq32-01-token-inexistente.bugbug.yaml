# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq32-01-token-inexistente
  name: BB-RQ32-01 Token inexistente (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Validación
    slug: bb-rq32-01-token-inexistente-1
    steps:
    - action: goto
      name: Abrir /reset-password?token=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff&email={{estudiante_email}}
      action_details:
        url: '{{url}}/reset-password?token=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff&email={{estudiante_email}}'
    - action: assert
      name: La página muestra «Token inválido o ya utilizado»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: Token inválido o ya utilizado
    - action: assert
      name: Ofrece pedir un nuevo enlace
      action_details:
        selector: xpath=//button[normalize-space(.)="Solicitar un nuevo enlace"]
        assertion_property: visible
        assertion_type: any
