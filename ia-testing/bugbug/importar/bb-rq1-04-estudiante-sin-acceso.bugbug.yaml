# yaml-language-server: $schema=https://api.bugbug.io/v2/schema/yaml/v1/
schema_version: '1.0'
schema_type: test
data:
  slug: bb-rq1-04-estudiante-sin-acceso
  name: BB-RQ1-04 Un estudiante no entra a la administración (error)
  runtime: browser
  screen_size: desktop
  notes: 'Generado desde ia-testing/bugbug/guiones-rq1-rq5.md. Variables requeridas: url, admin_email, admin_password, estudiante_email, estudiante_password, clave_valida.'
  groups:
  - group_name: Login
    slug: bb-rq1-04-estudiante-sin-acceso-1
    steps:
    - action: goto
      name: Abrir /login
      action_details:
        url: '{{url}}/login'
    - action: type
      name: Escribir el correo
      action_details:
        selector: xpath=//input[@type="email"]
        value: '{{estudiante_email}}'
    - action: type
      name: Escribir la contraseña
      action_details:
        selector: xpath=//input[@type="password"]
        value: '{{estudiante_password}}'
        has_secret_value: true
    - action: click
      name: Iniciar sesión
      action_details:
        selector: xpath=//button[@type="submit"]
    - action: assert
      name: La URL contiene /dashboard-estudiante
      action_details:
        assertion_property: pageUrlIs
        assertion_type: contain
        assertion_expected_value: /dashboard-estudiante
  - group_name: Acceso
    slug: bb-rq1-04-estudiante-sin-acceso-2
    steps:
    - action: goto
      name: Abrir /admin/users
      action_details:
        url: '{{url}}/admin/users'
    - action: assert
      name: La página muestra «Acceso no permitido»
      action_details:
        assertion_property: pageShowsText
        assertion_type: contain
        assertion_expected_value: Acceso no permitido
