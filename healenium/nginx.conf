server {
    listen 80;
    absolute_redirect off;

    # El HTML del reporte usa /healenium/report/ y enlaces relativos.
    # Spring solo responde sin la barra final, y el navegador cae en el 404.
    location = /healenium/report/ {
        proxy_pass http://healenium:7878/healenium/report;
    }

    location = /healenium/selectors/ {
        proxy_pass http://healenium:7878/healenium/selectors;
    }

    location = /healenium/report {
        return 302 /healenium/report/;
    }

    location = /healenium/selectors {
        return 302 /healenium/selectors/;
    }

    location = /healenium {
        return 302 /healenium/report/;
    }

    location = /healenium/ {
        return 302 /healenium/report/;
    }

    location / {
        proxy_pass http://healenium:7878;
    }
}
