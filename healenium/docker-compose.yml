# Healenium-Proxy + Selenium Grid, solo Chrome.
# El navegador corre dentro de Docker y abre el front del host en host.docker.internal:3001.
# Postgres se publica en 55432 para no chocar con un Postgres local en 5432.
# La clave es la de ejemplo del compose público de Healenium; solo vive en este contenedor.
services:
  postgres-db:
    image: postgres:15.5-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "55432:5432"
    volumes:
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: healenium_user
      POSTGRES_PASSWORD: YDk2nmNs4s9aCP6K
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.5.1
    container_name: healenium
    restart: on-failure
    depends_on:
      - postgres-db
    environment:
      SPRING_POSTGRES_DB: healenium
      SPRING_POSTGRES_SCHEMA: healenium
      SPRING_POSTGRES_USER: healenium_user
      SPRING_POSTGRES_PASSWORD: YDk2nmNs4s9aCP6K
      SPRING_POSTGRES_DB_HOST: postgres-db
      KEY_SELECTOR_URL: "false"
      COLLECT_METRICS: "true"
      FIND_ELEMENTS_AUTO_HEALING: "false"
      HLM_LOG_LEVEL: info
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  report:
    image: nginx:1.27-alpine
    container_name: healenium-report
    restart: on-failure
    ports:
      - "7878:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - healenium
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: on-failure
    networks:
      - healenium

  hlm-proxy:
    image: healenium/hlm-proxy:2.2.1
    container_name: hlm-proxy
    restart: on-failure
    ports:
      - "8085:8085"
    depends_on:
      - healenium
      - selenium-hub
      - selector-imitator
    environment:
      RECOVERY_TRIES: "1"
      SCORE_CAP: ".6"
      HEAL_ENABLED: "true"
      SELENIUM_SERVER_URL: http://selenium-hub:4444/wd/hub
      HEALENIUM_SERVER_URL: http://localhost:7878
      HEALENIUM_SERVICE: http://healenium:7878
      IMITATE_SERVICE: http://selector-imitator:8000
      HLM_LOG_LEVEL: info
    volumes:
      - ./logs/:/logs
    networks:
      - healenium

  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: selenium-hub
    restart: on-failure
    ports:
      - "4444:4444"
    networks:
      - healenium

  chrome:
    image: selenium/node-chromium:4.27.0
    container_name: node-chrome
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"
    networks:
      - healenium

networks:
  healenium:
    name: healenium
