server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DEF-FE-05: no anunciar la versión y comprimir el bundle (~1,9 MB sin gzip).
  server_tokens off;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # DEF-FE-05: cabeceras de seguridad. connect-src: back local (imagen Docker) y Render.
  # style-src 'unsafe-inline': framer-motion anima con estilos en línea.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3000 https://entreaulas-back.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # El enlace de recuperación lleva token y correo en la URL: nunca se envían como Referer.
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /assets/ {
    # add_header en un location reemplaza los del server: se repiten las de seguridad.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
