<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Control Healenium — antes</title></head>
<body>
  <!-- Mismos cambios del refactor del punto 13, sin clases de Tailwind. -->
  <main class="contenedor">
    <div role="dialog" class="control-dialogo" aria-labelledby="titulo">
      <h2 id="titulo">Editar pregunta</h2>
      <label>Texto de la pregunta <input class="control-texto" value="El docente explica con claridad"></label>
      <button type="submit" class="control-guardar">Guardar cambios de la pregunta</button>
    </div>
    <section class="control-grupos">
      <div class="control-grupo" aria-disabled="false"><span>Grupo 01</span></div>
    </section>
  </main>
</body></html>
